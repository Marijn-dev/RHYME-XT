dynamics:
  name: Amari
  args:
    n: 100 # nr locations for online training
    x_lim: &x_lim 10 # is set as [-x_lim,x_lim]
    dx: &dx 0.025
    theta: 1
    kernel_type: 1 # 0: Guassian, 1: Mex-hat, 2: Oscillatory.
    # kernel_pars: [1.5, 1, 0.1] # Gaussian
    kernel_pars: [3, 1.5, 1.5, 3, 0.2] # Mex-hat
    # kernel_pars: [1, 0.3, 0.9] # Oscillatory


sequence_generator:
  name: SpatialGaussian 
  args:
    x_lim: *x_lim
    dx: *dx
    period: 5
    amplitude: [1,5] # [low, high]
    std: [0.5,2.5] # [low, high]


initial_state_generator:
  name: AmariInitialState
  args:
    x_lim: *x_lim
    dx: *dx
    amplitude: [1,5]
    std: [0.5, 2.5]

control_delta: 0.5
